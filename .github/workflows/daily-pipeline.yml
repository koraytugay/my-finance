name: Sync Google Sheets Portfolio

on:
  schedule:
    # Monday to Friday every hour from 8:23 AM to 5:23 PM EDT (UTC-4 -> 12:23 to 21:23 UTC)
    - cron: "23 12-21 * * 1-5"
    # Saturday 12:23 PM EDT (16:23 UTC) to capture Friday evening weekly carryover updates
    - cron: "23 16 * * 6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: google-sheets-sync-pipeline
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 3. Sync from Google Sheets & Encrypt
        env:
          PORTFOLIO_PASSWORD: ${{ secrets.PORTFOLIO_PASSWORD }}
          NODE_OPTIONS: "--dns-result-order=ipv4first"
        run: |
          node sync.js

      - name: 4. Commit & Push Encrypted Portfolio to GitHub
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Stage encrypted files and public benchmark data
          git add encrypted/*.enc
          git add data/benchmarks.json 2>/dev/null || true
          git add data/fx.json 2>/dev/null || true
          
          if ! git diff --quiet --staged; then
            git commit -m "chore: automated sync ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git pull --rebase origin ${{ github.ref_name }}
            git push
            echo "✓ Changes committed and pushed successfully."
          else
            echo "ℹ No changes detected. Working tree clean, skipping commit."
          fi
